<svg xmlns="http://www.w3.org/2000/svg" class="diagram" id="f03-zero-svg" viewBox="0 0 920 385" role="img" aria-labelledby="f03-zero-title f03-zero-desc"><title id="f03-zero-title">ZeRO：单 rank 的哪些状态被分片</title><desc id="f03-zero-desc">ZeRO：单 rank 的哪些状态被分片。完整文字解释见图后分步说明与正文。</desc><defs><marker id="f03-zero-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--muted,#5b6e64)"/></marker></defs><style>.diagram .node{fill:var(--tint,#eaf2e9);stroke:var(--line,#dbe4dc);stroke-width:1}.diagram .plain{fill:var(--surface,#fff);stroke:var(--line,#dbe4dc)}.diagram .blue{fill:var(--blue-tint,#eaf1f8);stroke:var(--line,#dbe4dc)}.diagram .orange{fill:var(--orange-tint,#fbf0df);stroke:var(--line,#dbe4dc)}.diagram .purple{fill:var(--purple-tint,#f0edf7);stroke:var(--line,#dbe4dc)}.diagram .red{fill:var(--red-tint,#fbeaea);stroke:var(--line,#dbe4dc)}.diagram text{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;fill:var(--ink,#21352c);font-size:15px}.diagram .small{font-size:12px;fill:var(--muted,#5b6e64)}.diagram .mono{font-family:ui-monospace,Menlo,monospace;font-size:14px}.diagram .bold{font-weight:600}.diagram .arrow{fill:none;stroke:var(--muted,#5b6e64);stroke-width:1.5}.diagram .grid{stroke:var(--line,#dbe4dc);stroke-width:1}.diagram .axis{stroke:var(--muted,#5b6e64);stroke-width:1.2}.diagram .series{fill:none;stroke:var(--accent,#28634b);stroke-width:3}.diagram .secondary{fill:none;stroke:var(--blue,#35678b);stroke-width:2;stroke-dasharray:6 5}.diagram .dot{fill:var(--accent,#28634b)}.diagram .warn{fill:var(--orange,#945320)}.diagram .muted-mark{fill:var(--line,#dbe4dc)}</style><text x="35" y="30" class="small" text-anchor="start">教学假设：4 个 DP rank；每参数 P=2B、G=2B、O=12B（含 master copy）</text><text x="35" y="83" class="bold" text-anchor="start">DDP</text><rect x="190" y="58" width="68" height="37" rx="3" class="node"/><text x="224" y="82" class="small" text-anchor="middle">P 2</text><rect x="261" y="58" width="68" height="37" rx="3" class="blue"/><text x="295" y="82" class="small" text-anchor="middle">G 2</text><rect x="332" y="58" width="408" height="37" rx="3" class="purple"/><text x="536" y="82" class="mono" text-anchor="middle">O 12</text><text x="790" y="83" class="mono" text-anchor="start">16 B/参数</text><text x="35" y="149" class="bold" text-anchor="start">ZeRO-1</text><rect x="190" y="124" width="68" height="37" rx="3" class="node"/><text x="224" y="148" class="small" text-anchor="middle">P 2</text><rect x="261" y="124" width="68" height="37" rx="3" class="blue"/><text x="295" y="148" class="small" text-anchor="middle">G 2</text><rect x="332" y="124" width="102" height="37" rx="3" class="purple"/><text x="383" y="148" class="mono" text-anchor="middle">O 3</text><text x="790" y="149" class="mono" text-anchor="start">7 B/参数</text><text x="35" y="215" class="bold" text-anchor="start">ZeRO-2</text><rect x="190" y="190" width="68" height="37" rx="3" class="node"/><text x="224" y="214" class="small" text-anchor="middle">P 2</text><rect x="261" y="190" width="17" height="37" rx="3" class="blue"/><rect x="281" y="190" width="102" height="37" rx="3" class="purple"/><text x="332" y="214" class="mono" text-anchor="middle">O 3</text><text x="790" y="215" class="mono" text-anchor="start">5.5 B/参数</text><text x="35" y="281" class="bold" text-anchor="start">ZeRO-3</text><rect x="190" y="256" width="17" height="37" rx="3" class="node"/><rect x="210" y="256" width="17" height="37" rx="3" class="blue"/><rect x="230" y="256" width="102" height="37" rx="3" class="purple"/><text x="281" y="280" class="mono" text-anchor="middle">O 3</text><text x="790" y="281" class="mono" text-anchor="start">4 B/参数</text><text x="35" y="353" class="small" text-anchor="start">P 参数 · G 梯度 · O 优化器相关状态；此处不包含激活与聚合峰值。</text></svg>