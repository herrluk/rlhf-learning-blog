 y="238" class="small" text-anchor="middle">1/10</text><rect x="560" y="208" width="54" height="48" rx="4" class="blue"/><text x="587" y="238" class="small" text-anchor="middle">1/10</text><rect x="622" y="208" width="54" height="48" rx="4" class="blue"/><text x="649" y="238" class="small" text-anchor="middle">1/10</text><rect x="684" y="208" width="54" height="48" rx="4" class="blue"/><text x="711" y="238" class="small" text-anchor="middle">1/10</text><rect x="746" y="208" width="54" height="48" rx="4" class="blue"/><text x="773" y="238" class="small" text-anchor="middle">1/10</text><rect x="808" y="208" width="54" height="48" rx="4" class="blue"/><text x="835" y="238" class="small" text-anchor="middle">1/10</text><text x="250" y="293" class="small" text-anchor="start">短回答总权重 2/10，长回答总权重 8/10</text></svg>