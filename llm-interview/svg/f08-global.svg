<svg xmlns="http://www.w3.org/2000/svg" class="diagram" id="f08-global-svg" viewBox="0 0 920 422" role="img" aria-labelledby="f08-global-title f08-global-desc"><title id="f08-global-title">两个 rank 的样本长度不同，不能平均局部均值</title><desc id="f08-global-desc">两个 rank 的样本长度不同，不能平均局部均值。完整文字解释见图后分步说明与正文。</desc><defs><marker id="f08-global-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--muted,#5b6e64)"/></marker></defs><style>.diagram .node{fill:var(--tint,#eaf2e9);stroke:var(--line,#dbe4dc);stroke-width:1}.diagram .plain{fill:var(--surface,#fff);stroke:var(--line,#dbe4dc)}.diagram .blue{fill:var(--blue-tint,#eaf1f8);stroke:var(--line,#dbe4dc)}.diagram .orange{fill:var(--orange-tint,#fbf0df);stroke:var(--line,#dbe4dc)}.diagram .purple{fill:var(--purple-tint,#f0edf7);stroke:var(--line,#dbe4dc)}.diagram .red{fill:var(--red-tint,#fbeaea);stroke:var(--line,#dbe4dc)}.diagram text{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;fill:var(--ink,#21352c);font-size:15px}.diagram .small{font-size:12px;fill:var(--muted,#5b6e64)}.diagram .mono{font-family:ui-monospace,Menlo,monospace;font-size:14px}.diagram .bold{font-weight:600}.diagram .arrow{fill:none;stroke:var(--muted,#5b6e64);stroke-width:1.5}.diagram .grid{stroke:var(--line,#dbe4dc);stroke-width:1}.diagram .axis{stroke:var(--muted,#5b6e64);stroke-width:1.2}.diagram .series{fill:none;stroke:var(--accent,#28634b);stroke-width:3}.diagram .secondary{fill:none;stroke:var(--blue,#35678b);stroke-width:2;stroke-dasharray:6 5}.diagram .dot{fill:var(--accent,#28634b)}.diagram .warn{fill:var(--orange,#945320)}.diagram .muted-mark{fill:var(--line,#dbe4dc)}</style><g class="diagram-node"><rect x="35" y="40" width="245" height="124" rx="8" class="node"/><text x="157.5" y="67" class="bold" text-anchor="middle">rank 0</text><text x="157.5" y="95" class="small" text-anchor="middle">n₀=2，S₀=2</text><text x="157.5" y="113" class="small" text-anchor="middle">本地平均=1</text></g><g class="diagram-node"><rect x="35" y="205" width="245" height="124" rx="8" class="blue"/><text x="157.5" y="232" class="bold" text-anchor="middle">rank 1</text><text x="157.5" y="260" class="small" text-anchor="middle">n₁=8，S₁=24</text><text x="157.5" y="278" class="small" text-anchor="middle">本地平均=3</text></g><g class="diagram-node"><rect x="386" y="40" width="490" height="118" rx="8" class="orange"/><text x="631" y="67" class="bold" text-anchor="middle">错误目标：平均本地均值</text><text x="631" y="95" class="small" text-anchor="middle">(1+3)/2 = 2.0；每个 rank 总权重相同</text></g><g class="diagram-node"><rect x="386" y="211" width="490" height="118" rx="8" class="node"/><text x="631" y="238" class="bold" text-anchor="middle">全局 token mean</text><text x="631" y="266" class="small" text-anchor="middle">(2+24)/(2+8) = 2.6</text></g><path d="M282 103 H327 V182" class="arrow" marker-end="url(#f08-global-arrow)"/><path d="M282 267 H327 V188" class="arrow" marker-end="url(#f08-global-arrow)"/><path d="M327 185 H353 V99 H382" class="arrow" marker-end="url(#f08-global-arrow)"/><path d="M327 185 H353 V269 H382" class="arrow" marker-end="url(#f08-global-arrow)"/><text x="35" y="391" class="mono" text-anchor="start">DDP 梯度平均：每 rank backward W·S_r/N；平均后得到 Σ∇S_r / N。</text></svg>