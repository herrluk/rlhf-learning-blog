<svg xmlns="http://www.w3.org/2000/svg" class="diagram" id="f08-system-svg" viewBox="0 0 920 580" role="img" aria-labelledby="f08-system-title f08-system-desc"><title id="f08-system-title">一次 RL 迭代的计算与控制流</title><desc id="f08-system-desc">一次 RL 迭代的计算与控制流。完整文字解释见图后分步说明与正文。</desc><defs><marker id="f08-system-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--muted,#5b6e64)"/></marker></defs><style>.diagram .node{fill:var(--tint,#eaf2e9);stroke:var(--line,#dbe4dc);stroke-width:1}.diagram .plain{fill:var(--surface,#fff);stroke:var(--line,#dbe4dc)}.diagram .blue{fill:var(--blue-tint,#eaf1f8);stroke:var(--line,#dbe4dc)}.diagram .orange{fill:var(--orange-tint,#fbf0df);stroke:var(--line,#dbe4dc)}.diagram .purple{fill:var(--purple-tint,#f0edf7);stroke:var(--line,#dbe4dc)}.diagram .red{fill:var(--red-tint,#fbeaea);stroke:var(--line,#dbe4dc)}.diagram text{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;fill:var(--ink,#21352c);font-size:15px}.diagram .small{font-size:12px;fill:var(--muted,#5b6e64)}.diagram .mono{font-family:ui-monospace,Menlo,monospace;font-size:14px}.diagram .bold{font-weight:600}.diagram .arrow{fill:none;stroke:var(--muted,#5b6e64);stroke-width:1.5}.diagram .grid{stroke:var(--line,#dbe4dc);stroke-width:1}.diagram .axis{stroke:var(--muted,#5b6e64);stroke-width:1.2}.diagram .series{fill:none;stroke:var(--accent,#28634b);stroke-width:3}.diagram .secondary{fill:none;stroke:var(--blue,#35678b);stroke-width:2;stroke-dasharray:6 5}.diagram .dot{fill:var(--accent,#28634b)}.diagram .warn{fill:var(--orange,#945320)}.diagram .muted-mark{fill:var(--line,#dbe4dc)}</style><g class="diagram-node"><rect x="45" y="38" width="250" height="104" rx="8" class="plain"/><text x="170" y="65" class="bold" text-anchor="middle">Prompt 队列</text><text x="170" y="93" class="small" text-anchor="middle">任务 / group ID</text></g><g class="diagram-node"><rect x="333" y="38" width="250" height="104" rx="8" class="node"/><text x="458" y="65" class="bold" text-anchor="middle">Rollout</text><text x="458" y="93" class="small" text-anchor="middle">行为版本 / 采样概率</text></g><g class="diagram-node"><rect x="622" y="38" width="250" height="104" rx="8" class="orange"/><text x="747" y="65" class="bold" text-anchor="middle">环境与工具</text><text x="747" y="93" class="small" text-anchor="middle">call ID / 观察</text></g><g class="diagram-node"><rect x="45" y="218" width="250" height="104" rx="8" class="purple"/><text x="170" y="245" class="bold" text-anchor="middle">Reward / verifier</text><text x="170" y="273" class="small" text-anchor="middle">评分版本 / 失败类别</text></g><g class="diagram-node"><rect x="333" y="218" width="250" height="104" rx="8" class="blue"/><text x="458" y="245" class="bold" text-anchor="middle">分组与优势</text><text x="458" y="273" class="small" text-anchor="middle">reward + log-prob + mask</text></g><g class="diagram-node"><rect x="622" y="218" width="250" height="104" rx="8" class="node"/><text x="747" y="245" class="bold" text-anchor="middle">Actor / critic 更新</text><text x="747" y="273" class="small" text-anchor="middle">optimizer step / 版本</text></g><g class="diagram-node"><rect x="622" y="398" width="250" height="104" rx="8" class="plain"/><text x="747" y="425" class="bold" text-anchor="middle">Checkpoint</text><text x="747" y="453" class="small" text-anchor="middle">参数 + 消费状态</text></g><g class="diagram-node"><rect x="333" y="398" width="250" height="104" rx="8" class="orange"/><text x="458" y="425" class="bold" text-anchor="middle">权重发布</text><text x="458" y="453" class="small" text-anchor="middle">布局转换 / 原子切换</text></g><path d="M295,90 L330,90" class="arrow" marker-end="url(#f08-system-arrow)"/><path d="M583,73 L619,73" class="arrow" marker-end="url(#f08-system-arrow)"/><path d="M619,117 L583,117" class="arrow" marker-end="url(#f08-system-arrow)"/><path d="M458 142 V179 H170 V215" class="arrow" marker-end="url(#f08-system-arrow)"/><path d="M295,270 L330,270" class="arrow" marker-end="url(#f08-system-arrow)"/><path d="M583,270 L619,270" class="arrow" marker-end="url(#f08-system-arrow)"/><path d="M747,322 L747,395" class="arrow" marker-end="url(#f08-system-arrow)"/><path d="M690 322 V362 H458 V395" class="arrow" marker-end="url(#f08-system-arrow)"/><path d="M333 450 H20 V13 H458 V35" class="arrow" marker-end="url(#f08-system-arrow)"/><text x="40" y="549" class="small" text-anchor="start">逻辑职责图：这些节点可共卡或分卡；并不要求每个节点常驻独立完整模型。</text></svg>