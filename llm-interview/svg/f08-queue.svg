<svg xmlns="http://www.w3.org/2000/svg" class="diagram" id="f08-queue-svg" viewBox="0 0 920 390" role="img" aria-labelledby="f08-queue-title f08-queue-desc"><title id="f08-queue-title">异步队列：快生产端为什么不一定提升训练</title><desc id="f08-queue-desc">异步队列：快生产端为什么不一定提升训练。完整文字解释见图后分步说明与正文。</desc><defs><marker id="f08-queue-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--muted,#5b6e64)"/></marker></defs><style>.diagram .node{fill:var(--tint,#eaf2e9);stroke:var(--line,#dbe4dc);stroke-width:1}.diagram .plain{fill:var(--surface,#fff);stroke:var(--line,#dbe4dc)}.diagram .blue{fill:var(--blue-tint,#eaf1f8);stroke:var(--line,#dbe4dc)}.diagram .orange{fill:var(--orange-tint,#fbf0df);stroke:var(--line,#dbe4dc)}.diagram .purple{fill:var(--purple-tint,#f0edf7);stroke:var(--line,#dbe4dc)}.diagram .red{fill:var(--red-tint,#fbeaea);stroke:var(--line,#dbe4dc)}.diagram text{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;fill:var(--ink,#21352c);font-size:15px}.diagram .small{font-size:12px;fill:var(--muted,#5b6e64)}.diagram .mono{font-family:ui-monospace,Menlo,monospace;font-size:14px}.diagram .bold{font-weight:600}.diagram .arrow{fill:none;stroke:var(--muted,#5b6e64);stroke-width:1.5}.diagram .grid{stroke:var(--line,#dbe4dc);stroke-width:1}.diagram .axis{stroke:var(--muted,#5b6e64);stroke-width:1.2}.diagram .series{fill:none;stroke:var(--accent,#28634b);stroke-width:3}.diagram .secondary{fill:none;stroke:var(--blue,#35678b);stroke-width:2;stroke-dasharray:6 5}.diagram .dot{fill:var(--accent,#28634b)}.diagram .warn{fill:var(--orange,#945320)}.diagram .muted-mark{fill:var(--line,#dbe4dc)}</style><g class="diagram-node"><rect x="35" y="49" width="220" height="110" rx="8" class="node"/><text x="145" y="76" class="bold" text-anchor="middle">经验生产</text><text x="145" y="104" class="small" text-anchor="middle">4 group/s</text><text x="145" y="122" class="small" text-anchor="middle">长度与组大小固定</text></g><g class="diagram-node"><rect x="665" y="49" width="220" height="110" rx="8" class="blue"/><text x="775" y="76" class="bold" text-anchor="middle">训练消费</text><text x="775" y="104" class="small" text-anchor="middle">2 group/s</text><text x="775" y="122" class="small" text-anchor="middle">理论处理容量</text></g><path d="M257,104 L317,104" class="arrow" marker-end="url(#f08-queue-arrow)"/><path d="M601,104 L662,104" class="arrow" marker-end="url(#f08-queue-arrow)"/><rect x="320" y="65" width="280" height="76" rx="7" class="plain"/><rect x="324" y="69" width="272" height="68" rx="4" class="orange"/><text x="460" y="109" class="bold" text-anchor="middle">60 / 60 groups</text><g class="diagram-node"><rect x="35" y="223" width="390" height="88" rx="8" class="orange"/><text x="230" y="250" class="bold" text-anchor="middle">无背压时：60 秒积压</text><text x="230" y="278" class="small" text-anchor="middle">120 groups（从空队列开始）</text></g><g class="diagram-node"><rect x="490" y="223" width="390" height="88" rx="8" class="plain"/><text x="685" y="250" class="bold" text-anchor="middle">达到容量后的动作</text><text x="685" y="278" class="small" text-anchor="middle">背压 / 淘汰 / 扩容，并核对采样偏差</text></g><text x="35" y="359" class="small" text-anchor="start">教学流量模型：队列限额还要考虑 token 数和策略滞后；不是实测性能预测。</text></svg>