<svg xmlns="http://www.w3.org/2000/svg" class="diagram" id="f06-gae-svg" viewBox="0 0 920 408" role="img" aria-labelledby="f06-gae-title f06-gae-desc"><title id="f06-gae-title">三步 GAE：向前生成，向后累计</title><desc id="f06-gae-desc">三步 GAE：向前生成，向后累计。完整文字解释见图后分步说明与正文。</desc><defs><marker id="f06-gae-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--muted,#5b6e64)"/></marker></defs><style>.diagram .node{fill:var(--tint,#eaf2e9);stroke:var(--line,#dbe4dc);stroke-width:1}.diagram .plain{fill:var(--surface,#fff);stroke:var(--line,#dbe4dc)}.diagram .blue{fill:var(--blue-tint,#eaf1f8);stroke:var(--line,#dbe4dc)}.diagram .orange{fill:var(--orange-tint,#fbf0df);stroke:var(--line,#dbe4dc)}.diagram .purple{fill:var(--purple-tint,#f0edf7);stroke:var(--line,#dbe4dc)}.diagram .red{fill:var(--red-tint,#fbeaea);stroke:var(--line,#dbe4dc)}.diagram text{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;fill:var(--ink,#21352c);font-size:15px}.diagram .small{font-size:12px;fill:var(--muted,#5b6e64)}.diagram .mono{font-family:ui-monospace,Menlo,monospace;font-size:14px}.diagram .bold{font-weight:600}.diagram .arrow{fill:none;stroke:var(--muted,#5b6e64);stroke-width:1.5}.diagram .grid{stroke:var(--line,#dbe4dc);stroke-width:1}.diagram .axis{stroke:var(--muted,#5b6e64);stroke-width:1.2}.diagram .series{fill:none;stroke:var(--accent,#28634b);stroke-width:3}.diagram .secondary{fill:none;stroke:var(--blue,#35678b);stroke-width:2;stroke-dasharray:6 5}.diagram .dot{fill:var(--accent,#28634b)}.diagram .warn{fill:var(--orange,#945320)}.diagram .muted-mark{fill:var(--line,#dbe4dc)}</style><text x="40" y="29" class="small" text-anchor="start">γ=1；λ=0.90；最后一步真终止，V_next=0</text><g class="diagram-node"><rect x="40" y="60" width="250" height="119" rx="8" class="node"/><text x="165" y="87" class="bold" text-anchor="middle">t = 0</text><text x="165" y="115" class="small" text-anchor="middle">r=0   V=0.2</text><text x="165" y="133" class="small" text-anchor="middle">δ=0.100</text></g><g class="diagram-node"><rect x="40" y="241" width="250" height="80" rx="8" class="blue"/><text x="165" y="268" class="bold" text-anchor="middle">A_0 = 0.676</text><text x="165" y="296" class="small" text-anchor="middle">从右向左累计</text></g><path d="M165,182 L165,237" class="arrow" marker-end="url(#f06-gae-arrow)"/><path d="M293,114 L329,114" class="arrow" marker-end="url(#f06-gae-arrow)"/><path d="M331,281 L295,281" class="arrow" marker-end="url(#f06-gae-arrow)"/><text x="313" y="272" class="small" text-anchor="middle">λ</text><g class="diagram-node"><rect x="335" y="60" width="250" height="119" rx="8" class="node"/><text x="460" y="87" class="bold" text-anchor="middle">t = 1</text><text x="460" y="115" class="small" text-anchor="middle">r=0   V=0.3</text><text x="460" y="133" class="small" text-anchor="middle">δ=0.100</text></g><g class="diagram-node"><rect x="335" y="241" width="250" height="80" rx="8" class="blue"/><text x="460" y="268" class="bold" text-anchor="middle">A_1 = 0.640</text><text x="460" y="296" class="small" text-anchor="middle">从右向左累计</text></g><path d="M460,182 L460,237" class="arrow" marker-end="url(#f06-gae-arrow)"/><path d="M588,114 L624,114" class="arrow" marker-end="url(#f06-gae-arrow)"/><path d="M626,281 L590,281" class="arrow" marker-end="url(#f06-gae-arrow)"/><text x="608" y="272" class="small" text-anchor="middle">λ</text><g class="diagram-node"><rect x="630" y="60" width="250" height="119" rx="8" class="orange"/><text x="755" y="87" class="bold" text-anchor="middle">t = 2</text><text x="755" y="115" class="small" text-anchor="middle">r=1   V=0.4</text><text x="755" y="133" class="small" text-anchor="middle">δ=0.600</text></g><g class="diagram-node"><rect x="630" y="241" width="250" height="80" rx="8" class="blue"/><text x="755" y="268" class="bold" text-anchor="middle">A_2 = 0.600</text><text x="755" y="296" class="small" text-anchor="middle">从右向左累计</text></g><path d="M755,182 L755,237" class="arrow" marker-end="url(#f06-gae-arrow)"/><text x="40" y="375" class="mono" text-anchor="start">δ_t = r_t + γ·bootstrap·V_next − V_t；A_t = δ_t + γλ·trace·A_next</text></svg>