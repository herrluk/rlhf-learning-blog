<svg xmlns="http://www.w3.org/2000/svg" class="diagram" id="f09-roofline-svg" viewBox="0 0 920 456" role="img" aria-labelledby="f09-roofline-title f09-roofline-desc"><title id="f09-roofline-title">Roofline：一个算子的理论天花板</title><desc id="f09-roofline-desc">Roofline：一个算子的理论天花板。完整文字解释见图后分步说明与正文。</desc><defs><marker id="f09-roofline-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--muted,#5b6e64)"/></marker></defs><style>.diagram .node{fill:var(--tint,#eaf2e9);stroke:var(--line,#dbe4dc);stroke-width:1}.diagram .plain{fill:var(--surface,#fff);stroke:var(--line,#dbe4dc)}.diagram .blue{fill:var(--blue-tint,#eaf1f8);stroke:var(--line,#dbe4dc)}.diagram .orange{fill:var(--orange-tint,#fbf0df);stroke:var(--line,#dbe4dc)}.diagram .purple{fill:var(--purple-tint,#f0edf7);stroke:var(--line,#dbe4dc)}.diagram .red{fill:var(--red-tint,#fbeaea);stroke:var(--line,#dbe4dc)}.diagram text{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;fill:var(--ink,#21352c);font-size:15px}.diagram .small{font-size:12px;fill:var(--muted,#5b6e64)}.diagram .mono{font-family:ui-monospace,Menlo,monospace;font-size:14px}.diagram .bold{font-weight:600}.diagram .arrow{fill:none;stroke:var(--muted,#5b6e64);stroke-width:1.5}.diagram .grid{stroke:var(--line,#dbe4dc);stroke-width:1}.diagram .axis{stroke:var(--muted,#5b6e64);stroke-width:1.2}.diagram .series{fill:none;stroke:var(--accent,#28634b);stroke-width:3}.diagram .secondary{fill:none;stroke:var(--blue,#35678b);stroke-width:2;stroke-dasharray:6 5}.diagram .dot{fill:var(--accent,#28634b)}.diagram .warn{fill:var(--orange,#945320)}.diagram .muted-mark{fill:var(--line,#dbe4dc)}</style><path d="M100 54 V322" class="grid"/><path d="M100 322 H814" class="grid"/><text x="100" y="349" class="small" text-anchor="middle">0</text><text x="83" y="326" class="small" text-anchor="end">0</text><path d="M278.5 54 V322" class="grid"/><path d="M100 255 H814" class="grid"/><text x="278.5" y="349" class="small" text-anchor="middle">20</text><text x="83" y="259" class="small" text-anchor="end">25</text><path d="M457 54 V322" class="grid"/><path d="M100 188 H814" class="grid"/><text x="457" y="349" class="small" text-anchor="middle">40</text><text x="83" y="192" class="small" text-anchor="end">50</text><path d="M635.5 54 V322" class="grid"/><path d="M100 121 H814" class="grid"/><text x="635.5" y="349" class="small" text-anchor="middle">60</text><text x="83" y="125" class="small" text-anchor="end">75</text><path d="M814 54 V322" class="grid"/><path d="M100 54 H814" class="grid"/><text x="814" y="349" class="small" text-anchor="middle">80</text><text x="83" y="58" class="small" text-anchor="end">100</text><text x="455" y="388" class="small" text-anchor="middle">算术强度（FLOP / byte）</text><text x="100" y="28" class="small" text-anchor="start">性能上限（TFLOP/s）</text><path d="M100 322 L457 107.6 L814 107.6" class="series"/><circle cx="207.1" cy="257.68" r="6" class="dot"/><text x="115" y="75" class="small" text-anchor="start">假设：带宽 2 TB/s，算力 80 TFLOP/s</text><text x="110" y="426" class="small" text-anchor="start">AI=12 → 上限 min(2×12,80)=24 TFLOP/s；实际还受 launch、同步等影响。</text></svg>