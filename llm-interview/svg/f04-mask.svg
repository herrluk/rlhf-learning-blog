<svg xmlns="http://www.w3.org/2000/svg" class="diagram" id="f04-mask-svg" viewBox="0 0 920 316" role="img" aria-labelledby="f04-mask-title f04-mask-desc"><title id="f04-mask-title">哪些 token 是监督目标，哪些只是条件</title><desc id="f04-mask-desc">哪些 token 是监督目标，哪些只是条件。完整文字解释见图后分步说明与正文。</desc><defs><marker id="f04-mask-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--muted,#5b6e64)"/></marker></defs><style>.diagram .node{fill:var(--tint,#eaf2e9);stroke:var(--line,#dbe4dc);stroke-width:1}.diagram .plain{fill:var(--surface,#fff);stroke:var(--line,#dbe4dc)}.diagram .blue{fill:var(--blue-tint,#eaf1f8);stroke:var(--line,#dbe4dc)}.diagram .orange{fill:var(--orange-tint,#fbf0df);stroke:var(--line,#dbe4dc)}.diagram .purple{fill:var(--purple-tint,#f0edf7);stroke:var(--line,#dbe4dc)}.diagram .red{fill:var(--red-tint,#fbeaea);stroke:var(--line,#dbe4dc)}.diagram text{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;fill:var(--ink,#21352c);font-size:15px}.diagram .small{font-size:12px;fill:var(--muted,#5b6e64)}.diagram .mono{font-family:ui-monospace,Menlo,monospace;font-size:14px}.diagram .bold{font-weight:600}.diagram .arrow{fill:none;stroke:var(--muted,#5b6e64);stroke-width:1.5}.diagram .grid{stroke:var(--line,#dbe4dc);stroke-width:1}.diagram .axis{stroke:var(--muted,#5b6e64);stroke-width:1.2}.diagram .series{fill:none;stroke:var(--accent,#28634b);stroke-width:3}.diagram .secondary{fill:none;stroke:var(--blue,#35678b);stroke-width:2;stroke-dasharray:6 5}.diagram .dot{fill:var(--accent,#28634b)}.diagram .warn{fill:var(--orange,#945320)}.diagram .muted-mark{fill:var(--line,#dbe4dc)}</style><g class="diagram-node"><rect x="35" y="35" width="135" height="65" rx="8" class="plain"/><text x="102.5" y="62" class="bold" text-anchor="middle">system</text><text x="102.5" y="90" class="small" text-anchor="middle"></text></g><text x="102" y="137" class="bold" text-anchor="middle">0</text><g class="diagram-node"><rect x="35" y="171" width="135" height="62" rx="8" class="plain"/><text x="102.5" y="198" class="bold" text-anchor="middle">作为条件/忽略</text><text x="102.5" y="226" class="small" text-anchor="middle"></text></g><g class="diagram-node"><rect x="182" y="35" width="135" height="65" rx="8" class="plain"/><text x="249.5" y="62" class="bold" text-anchor="middle">user</text><text x="249.5" y="90" class="small" text-anchor="middle"></text></g><text x="249" y="137" class="bold" text-anchor="middle">0</text><g class="diagram-node"><rect x="182" y="171" width="135" height="62" rx="8" class="plain"/><text x="249.5" y="198" class="bold" text-anchor="middle">作为条件/忽略</text><text x="249.5" y="226" class="small" text-anchor="middle"></text></g><g class="diagram-node"><rect x="329" y="35" width="135" height="65" rx="8" class="node"/><text x="396.5" y="62" class="bold" text-anchor="middle">assistant</text><text x="396.5" y="90" class="small" text-anchor="middle"></text></g><text x="396" y="137" class="bold" text-anchor="middle">1</text><g class="diagram-node"><rect x="329" y="171" width="135" height="62" rx="8" class="blue"/><text x="396.5" y="198" class="bold" text-anchor="middle">参与策略目标</text><text x="396.5" y="226" class="small" text-anchor="middle"></text></g><g class="diagram-node"><rect x="476" y="35" width="135" height="65" rx="8" class="plain"/><text x="543.5" y="62" class="bold" text-anchor="middle">tool</text><text x="543.5" y="90" class="small" text-anchor="middle"></text></g><text x="543" y="137" class="bold" text-anchor="middle">0</text><g class="diagram-node"><rect x="476" y="171" width="135" height="62" rx="8" class="plain"/><text x="543.5" y="198" class="bold" text-anchor="middle">作为条件/忽略</text><text x="543.5" y="226" class="small" text-anchor="middle"></text></g><g class="diagram-node"><rect x="623" y="35" width="135" height="65" rx="8" class="node"/><text x="690.5" y="62" class="bold" text-anchor="middle">assistant</text><text x="690.5" y="90" class="small" text-anchor="middle"></text></g><text x="690" y="137" class="bold" text-anchor="middle">1</text><g class="diagram-node"><rect x="623" y="171" width="135" height="62" rx="8" class="blue"/><text x="690.5" y="198" class="bold" text-anchor="middle">参与策略目标</text><text x="690.5" y="226" class="small" text-anchor="middle"></text></g><g class="diagram-node"><rect x="770" y="35" width="135" height="65" rx="8" class="plain"/><text x="837.5" y="62" class="bold" text-anchor="middle">padding</text><text x="837.5" y="90" class="small" text-anchor="middle"></text></g><text x="837" y="137" class="bold" text-anchor="middle">0</text><g class="diagram-node"><rect x="770" y="171" width="135" height="62" rx="8" class="plain"/><text x="837.5" y="198" class="bold" text-anchor="middle">作为条件/忽略</text><text x="837.5" y="226" class="small" text-anchor="middle"></text></g><text x="35" y="285" class="small" text-anchor="start">1/0 是目标/动作 mask 示意；环境观察仍可影响后续动作与回报。</text></svg>