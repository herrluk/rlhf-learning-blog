<svg xmlns="http://www.w3.org/2000/svg" class="diagram" id="f07-gradient-svg" viewBox="0 0 920 380" role="img" aria-labelledby="f07-gradient-title f07-gradient-desc"><title id="f07-gradient-title">KL 前向数值相同，梯度路径仍可能不同</title><desc id="f07-gradient-desc">KL 前向数值相同，梯度路径仍可能不同。完整文字解释见图后分步说明与正文。</desc><defs><marker id="f07-gradient-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--muted,#5b6e64)"/></marker></defs><style>.diagram .node{fill:var(--tint,#eaf2e9);stroke:var(--line,#dbe4dc);stroke-width:1}.diagram .plain{fill:var(--surface,#fff);stroke:var(--line,#dbe4dc)}.diagram .blue{fill:var(--blue-tint,#eaf1f8);stroke:var(--line,#dbe4dc)}.diagram .orange{fill:var(--orange-tint,#fbf0df);stroke:var(--line,#dbe4dc)}.diagram .purple{fill:var(--purple-tint,#f0edf7);stroke:var(--line,#dbe4dc)}.diagram .red{fill:var(--red-tint,#fbeaea);stroke:var(--line,#dbe4dc)}.diagram text{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;fill:var(--ink,#21352c);font-size:15px}.diagram .small{font-size:12px;fill:var(--muted,#5b6e64)}.diagram .mono{font-family:ui-monospace,Menlo,monospace;font-size:14px}.diagram .bold{font-weight:600}.diagram .arrow{fill:none;stroke:var(--muted,#5b6e64);stroke-width:1.5}.diagram .grid{stroke:var(--line,#dbe4dc);stroke-width:1}.diagram .axis{stroke:var(--muted,#5b6e64);stroke-width:1.2}.diagram .series{fill:none;stroke:var(--accent,#28634b);stroke-width:3}.diagram .secondary{fill:none;stroke:var(--blue,#35678b);stroke-width:2;stroke-dasharray:6 5}.diagram .dot{fill:var(--accent,#28634b)}.diagram .warn{fill:var(--orange,#945320)}.diagram .muted-mark{fill:var(--line,#dbe4dc)}</style><g class="diagram-node"><rect x="35" y="124" width="190" height="110" rx="8" class="node"/><text x="130" y="151" class="bold" text-anchor="middle">KL 样本估计</text><text x="130" y="179" class="small" text-anchor="middle">采样分布先写清</text></g><g class="diagram-node"><rect x="308" y="32" width="285" height="108" rx="8" class="orange"/><text x="450.5" y="59" class="bold" text-anchor="middle">路径 A：reward shaping</text><text x="450.5" y="87" class="small" text-anchor="middle">回报 → advantage → PG</text></g><g class="diagram-node"><rect x="308" y="236" width="285" height="108" rx="8" class="blue"/><text x="450.5" y="263" class="bold" text-anchor="middle">路径 B：独立 loss</text><text x="450.5" y="291" class="small" text-anchor="middle">计算图 → autograd</text></g><g class="diagram-node"><rect x="686" y="124" width="200" height="110" rx="8" class="node"/><text x="786" y="151" class="bold" text-anchor="middle">核对梯度语义</text><text x="786" y="179" class="small" text-anchor="middle">detach / IS / reduction</text></g><path d="M225 150 H266 V86 H305" class="arrow" marker-end="url(#f07-gradient-arrow)"/><path d="M225 205 H266 V290 H305" class="arrow" marker-end="url(#f07-gradient-arrow)"/><path d="M593 86 H638 V150 H683" class="arrow" marker-end="url(#f07-gradient-arrow)"/><path d="M593 290 H638 V205 H683" class="arrow" marker-end="url(#f07-gradient-arrow)"/></svg>