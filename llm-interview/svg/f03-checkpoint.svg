<svg xmlns="http://www.w3.org/2000/svg" class="diagram" id="f03-checkpoint-svg" viewBox="0 0 920 155" role="img" aria-labelledby="f03-checkpoint-title f03-checkpoint-desc"><title id="f03-checkpoint-title">异步 checkpoint：暂存不等于持久化</title><desc id="f03-checkpoint-desc">异步 checkpoint：暂存不等于持久化。完整文字解释见图后分步说明与正文。</desc><defs><marker id="f03-checkpoint-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--muted,#5b6e64)"/></marker></defs><style>.diagram .node{fill:var(--tint,#eaf2e9);stroke:var(--line,#dbe4dc);stroke-width:1}.diagram .plain{fill:var(--surface,#fff);stroke:var(--line,#dbe4dc)}.diagram .blue{fill:var(--blue-tint,#eaf1f8);stroke:var(--line,#dbe4dc)}.diagram .orange{fill:var(--orange-tint,#fbf0df);stroke:var(--line,#dbe4dc)}.diagram .purple{fill:var(--purple-tint,#f0edf7);stroke:var(--line,#dbe4dc)}.diagram .red{fill:var(--red-tint,#fbeaea);stroke:var(--line,#dbe4dc)}.diagram text{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;fill:var(--ink,#21352c);font-size:15px}.diagram .small{font-size:12px;fill:var(--muted,#5b6e64)}.diagram .mono{font-family:ui-monospace,Menlo,monospace;font-size:14px}.diagram .bold{font-weight:600}.diagram .arrow{fill:none;stroke:var(--muted,#5b6e64);stroke-width:1.5}.diagram .grid{stroke:var(--line,#dbe4dc);stroke-width:1}.diagram .axis{stroke:var(--muted,#5b6e64);stroke-width:1.2}.diagram .series{fill:none;stroke:var(--accent,#28634b);stroke-width:3}.diagram .secondary{fill:none;stroke:var(--blue,#35678b);stroke-width:2;stroke-dasharray:6 5}.diagram .dot{fill:var(--accent,#28634b)}.diagram .warn{fill:var(--orange,#945320)}.diagram .muted-mark{fill:var(--line,#dbe4dc)}</style><g class="diagram-node"><rect x="40" y="30" width="192" height="98" rx="8" class="node"/><text x="136" y="57" class="bold" text-anchor="middle">确定版本</text><text x="136" y="85" class="small" text-anchor="middle">step / RNG / 数据游标</text></g><path d="M235,79 L253,79" class="arrow" marker-end="url(#f03-checkpoint-arrow)"/><g class="diagram-node"><rect x="256" y="30" width="192" height="98" rx="8" class="blue"/><text x="352" y="57" class="bold" text-anchor="middle">独立暂存</text><text x="352" y="85" class="small" text-anchor="middle">避免原地更新污染</text></g><path d="M451,79 L469,79" class="arrow" marker-end="url(#f03-checkpoint-arrow)"/><g class="diagram-node"><rect x="472" y="30" width="192" height="98" rx="8" class="orange"/><text x="568" y="57" class="bold" text-anchor="middle">持久化分片</text><text x="568" y="85" class="small" text-anchor="middle">临时对象 + 完整性校验</text></g><path d="M667,79 L685,79" class="arrow" marker-end="url(#f03-checkpoint-arrow)"/><g class="diagram-node"><rect x="688" y="30" width="192" height="98" rx="8" class="node"/><text x="784" y="57" class="bold" text-anchor="middle">发布 manifest</text><text x="784" y="85" class="small" text-anchor="middle">可恢复的完成标记</text></g></svg>