<svg xmlns="http://www.w3.org/2000/svg" class="diagram" id="f09-online-svg" viewBox="0 0 920 435" role="img" aria-labelledby="f09-online-title f09-online-desc"><title id="f09-online-title">Online softmax：分块之后仍然可以正确合并</title><desc id="f09-online-desc">Online softmax：分块之后仍然可以正确合并。完整文字解释见图后分步说明与正文。</desc><defs><marker id="f09-online-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--muted,#5b6e64)"/></marker></defs><style>.diagram .node{fill:var(--tint,#eaf2e9);stroke:var(--line,#dbe4dc);stroke-width:1}.diagram .plain{fill:var(--surface,#fff);stroke:var(--line,#dbe4dc)}.diagram .blue{fill:var(--blue-tint,#eaf1f8);stroke:var(--line,#dbe4dc)}.diagram .orange{fill:var(--orange-tint,#fbf0df);stroke:var(--line,#dbe4dc)}.diagram .purple{fill:var(--purple-tint,#f0edf7);stroke:var(--line,#dbe4dc)}.diagram .red{fill:var(--red-tint,#fbeaea);stroke:var(--line,#dbe4dc)}.diagram text{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;fill:var(--ink,#21352c);font-size:15px}.diagram .small{font-size:12px;fill:var(--muted,#5b6e64)}.diagram .mono{font-family:ui-monospace,Menlo,monospace;font-size:14px}.diagram .bold{font-weight:600}.diagram .arrow{fill:none;stroke:var(--muted,#5b6e64);stroke-width:1.5}.diagram .grid{stroke:var(--line,#dbe4dc);stroke-width:1}.diagram .axis{stroke:var(--muted,#5b6e64);stroke-width:1.2}.diagram .series{fill:none;stroke:var(--accent,#28634b);stroke-width:3}.diagram .secondary{fill:none;stroke:var(--blue,#35678b);stroke-width:2;stroke-dasharray:6 5}.diagram .dot{fill:var(--accent,#28634b)}.diagram .warn{fill:var(--orange,#945320)}.diagram .muted-mark{fill:var(--line,#dbe4dc)}</style><g class="diagram-node"><rect x="35" y="50" width="250" height="120" rx="8" class="node"/><text x="160" y="77" class="bold" text-anchor="middle">块 A：[1000,1001]</text><text x="160" y="105" class="small" text-anchor="middle">m_A=1001</text><text x="160" y="123" class="small" text-anchor="middle">l_A=1+exp(-1)=1.3679</text></g><g class="diagram-node"><rect x="35" y="227" width="250" height="120" rx="8" class="blue"/><text x="160" y="254" class="bold" text-anchor="middle">块 B：[999]</text><text x="160" y="282" class="small" text-anchor="middle">m_B=999</text><text x="160" y="300" class="small" text-anchor="middle">l_B=1</text></g><g class="diagram-node"><rect x="446" y="130" width="422" height="145" rx="8" class="purple"/><text x="657" y="157" class="bold" text-anchor="middle">合并统计量</text><text x="657" y="185" class="small" text-anchor="middle">m=max(1001,999)=1001</text><text x="657" y="203" class="small" text-anchor="middle">l=1.3679+exp(-2)×1=1.5032</text></g><path d="M285 110 H367 V176 H442" class="arrow" marker-end="url(#f09-online-arrow)"/><path d="M285 287 H367 V230 H442" class="arrow" marker-end="url(#f09-online-arrow)"/><text x="35" y="405" class="small" text-anchor="start">以共同最大值重标定指数和；不必保存完整 Attention 分数矩阵。</text></svg>