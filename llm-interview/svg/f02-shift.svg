<svg xmlns="http://www.w3.org/2000/svg" class="diagram" id="f02-shift-svg" viewBox="0 0 920 340" role="img" aria-labelledby="f02-shift-title f02-shift-desc"><title id="f02-shift-title">Label shift：预测目标向前对齐一格</title><desc id="f02-shift-desc">Label shift：预测目标向前对齐一格。完整文字解释见图后分步说明与正文。</desc><defs><marker id="f02-shift-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--muted,#5b6e64)"/></marker></defs><style>.diagram .node{fill:var(--tint,#eaf2e9);stroke:var(--line,#dbe4dc);stroke-width:1}.diagram .plain{fill:var(--surface,#fff);stroke:var(--line,#dbe4dc)}.diagram .blue{fill:var(--blue-tint,#eaf1f8);stroke:var(--line,#dbe4dc)}.diagram .orange{fill:var(--orange-tint,#fbf0df);stroke:var(--line,#dbe4dc)}.diagram .purple{fill:var(--purple-tint,#f0edf7);stroke:var(--line,#dbe4dc)}.diagram .red{fill:var(--red-tint,#fbeaea);stroke:var(--line,#dbe4dc)}.diagram text{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;fill:var(--ink,#21352c);font-size:15px}.diagram .small{font-size:12px;fill:var(--muted,#5b6e64)}.diagram .mono{font-family:ui-monospace,Menlo,monospace;font-size:14px}.diagram .bold{font-weight:600}.diagram .arrow{fill:none;stroke:var(--muted,#5b6e64);stroke-width:1.5}.diagram .grid{stroke:var(--line,#dbe4dc);stroke-width:1}.diagram .axis{stroke:var(--muted,#5b6e64);stroke-width:1.2}.diagram .series{fill:none;stroke:var(--accent,#28634b);stroke-width:3}.diagram .secondary{fill:none;stroke:var(--blue,#35678b);stroke-width:2;stroke-dasharray:6 5}.diagram .dot{fill:var(--accent,#28634b)}.diagram .warn{fill:var(--orange,#945320)}.diagram .muted-mark{fill:var(--line,#dbe4dc)}</style><text x="35" y="58" class="small" text-anchor="start">输入 token</text><g class="diagram-node"><rect x="175" y="25" width="150" height="58" rx="8" class="node"/><text x="250" y="52" class="bold" text-anchor="middle">BOS</text><text x="250" y="80" class="small" text-anchor="middle"></text></g><g class="diagram-node"><rect x="349" y="25" width="150" height="58" rx="8" class="node"/><text x="424" y="52" class="bold" text-anchor="middle">A</text><text x="424" y="80" class="small" text-anchor="middle"></text></g><g class="diagram-node"><rect x="523" y="25" width="150" height="58" rx="8" class="node"/><text x="598" y="52" class="bold" text-anchor="middle">B</text><text x="598" y="80" class="small" text-anchor="middle"></text></g><g class="diagram-node"><rect x="697" y="25" width="150" height="58" rx="8" class="node"/><text x="772" y="52" class="bold" text-anchor="middle">EOS</text><text x="772" y="80" class="small" text-anchor="middle"></text></g><text x="35" y="145" class="small" text-anchor="start">当前位置输出</text><g class="diagram-node"><rect x="175" y="112" width="150" height="58" rx="8" class="node"/><text x="250" y="139" class="bold" text-anchor="middle">logits₀</text><text x="250" y="167" class="small" text-anchor="middle"></text></g><g class="diagram-node"><rect x="349" y="112" width="150" height="58" rx="8" class="node"/><text x="424" y="139" class="bold" text-anchor="middle">logits₁</text><text x="424" y="167" class="small" text-anchor="middle"></text></g><g class="diagram-node"><rect x="523" y="112" width="150" height="58" rx="8" class="node"/><text x="598" y="139" class="bold" text-anchor="middle">logits₂</text><text x="598" y="167" class="small" text-anchor="middle"></text></g><g class="diagram-node"><rect x="697" y="112" width="150" height="58" rx="8" class="node"/><text x="772" y="139" class="bold" text-anchor="middle">logits₃</text><text x="772" y="167" class="small" text-anchor="middle"></text></g><text x="35" y="232" class="small" text-anchor="start">下一 token 目标</text><g class="diagram-node"><rect x="175" y="199" width="150" height="58" rx="8" class="blue"/><text x="250" y="226" class="bold" text-anchor="middle">A</text><text x="250" y="254" class="small" text-anchor="middle"></text></g><g class="diagram-node"><rect x="349" y="199" width="150" height="58" rx="8" class="blue"/><text x="424" y="226" class="bold" text-anchor="middle">B</text><text x="424" y="254" class="small" text-anchor="middle"></text></g><g class="diagram-node"><rect x="523" y="199" width="150" height="58" rx="8" class="blue"/><text x="598" y="226" class="bold" text-anchor="middle">EOS</text><text x="598" y="254" class="small" text-anchor="middle"></text></g><g class="diagram-node"><rect x="697" y="199" width="150" height="58" rx="8" class="plain"/><text x="772" y="226" class="bold" text-anchor="middle">不计目标</text><text x="772" y="254" class="small" text-anchor="middle"></text></g><path d="M250,173 L250,196" class="arrow" marker-end="url(#f02-shift-arrow)"/><path d="M424,173 L424,196" class="arrow" marker-end="url(#f02-shift-arrow)"/><path d="M598,173 L598,196" class="arrow" marker-end="url(#f02-shift-arrow)"/><text x="175" y="310" class="mono" text-anchor="start">logits[:, :-1] 预测 input_ids[:, 1:]；mask 取相同目标位置</text></svg>