<svg xmlns="http://www.w3.org/2000/svg" class="diagram" id="f03-tp-svg" viewBox="0 0 920 390" role="img" aria-labelledby="f03-tp-title f03-tp-desc"><title id="f03-tp-title">MLP 张量并行：局部通道到完整输出</title><desc id="f03-tp-desc">MLP 张量并行：局部通道到完整输出。完整文字解释见图后分步说明与正文。</desc><defs><marker id="f03-tp-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--muted,#5b6e64)"/></marker></defs><style>.diagram .node{fill:var(--tint,#eaf2e9);stroke:var(--line,#dbe4dc);stroke-width:1}.diagram .plain{fill:var(--surface,#fff);stroke:var(--line,#dbe4dc)}.diagram .blue{fill:var(--blue-tint,#eaf1f8);stroke:var(--line,#dbe4dc)}.diagram .orange{fill:var(--orange-tint,#fbf0df);stroke:var(--line,#dbe4dc)}.diagram .purple{fill:var(--purple-tint,#f0edf7);stroke:var(--line,#dbe4dc)}.diagram .red{fill:var(--red-tint,#fbeaea);stroke:var(--line,#dbe4dc)}.diagram text{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;fill:var(--ink,#21352c);font-size:15px}.diagram .small{font-size:12px;fill:var(--muted,#5b6e64)}.diagram .mono{font-family:ui-monospace,Menlo,monospace;font-size:14px}.diagram .bold{font-weight:600}.diagram .arrow{fill:none;stroke:var(--muted,#5b6e64);stroke-width:1.5}.diagram .grid{stroke:var(--line,#dbe4dc);stroke-width:1}.diagram .axis{stroke:var(--muted,#5b6e64);stroke-width:1.2}.diagram .series{fill:none;stroke:var(--accent,#28634b);stroke-width:3}.diagram .secondary{fill:none;stroke:var(--blue,#35678b);stroke-width:2;stroke-dasharray:6 5}.diagram .dot{fill:var(--accent,#28634b)}.diagram .warn{fill:var(--orange,#945320)}.diagram .muted-mark{fill:var(--line,#dbe4dc)}</style><g class="diagram-node"><rect x="35" y="115" width="145" height="95" rx="8" class="node"/><text x="107.5" y="142" class="bold" text-anchor="middle">输入 X</text><text x="107.5" y="170" class="small" text-anchor="middle">[tokens, d]</text></g><g class="diagram-node"><rect x="258" y="30" width="225" height="95" rx="8" class="node"/><text x="370.5" y="57" class="bold" text-anchor="middle">rank 0 · W₁,₀</text><text x="370.5" y="85" class="small" text-anchor="middle">[d, f/2] → H₀</text></g><g class="diagram-node"><rect x="258" y="215" width="225" height="95" rx="8" class="blue"/><text x="370.5" y="242" class="bold" text-anchor="middle">rank 1 · W₁,₁</text><text x="370.5" y="270" class="small" text-anchor="middle">[d, f/2] → H₁</text></g><g class="diagram-node"><rect x="550" y="30" width="200" height="95" rx="8" class="node"/><text x="650" y="57" class="bold" text-anchor="middle">H₀ × W₂,₀</text><text x="650" y="85" class="small" text-anchor="middle">局部输出 Y₀</text></g><g class="diagram-node"><rect x="550" y="215" width="200" height="95" rx="8" class="blue"/><text x="650" y="242" class="bold" text-anchor="middle">H₁ × W₂,₁</text><text x="650" y="270" class="small" text-anchor="middle">局部输出 Y₁</text></g><path d="M180 143 H217 V77 H255" class="arrow" marker-end="url(#f03-tp-arrow)"/><path d="M180 181 H217 V263 H255" class="arrow" marker-end="url(#f03-tp-arrow)"/><path d="M486,77 L547,77" class="arrow" marker-end="url(#f03-tp-arrow)"/><path d="M486,263 L547,263" class="arrow" marker-end="url(#f03-tp-arrow)"/><g class="diagram-node"><rect x="776" y="126" width="122" height="80" rx="8" class="purple"/><text x="837" y="153" class="bold" text-anchor="middle">求和</text><text x="837" y="181" class="small" text-anchor="middle">Y₀ + Y₁</text></g><path d="M750 77 H838 V123" class="arrow" marker-end="url(#f03-tp-arrow)"/><path d="M750 263 H838 V208" class="arrow" marker-end="url(#f03-tp-arrow)"/><text x="35" y="358" class="small" text-anchor="start">第一次按中间通道切分，第二次形成局部贡献；用归约恢复完整输出。</text></svg>