<svg xmlns="http://www.w3.org/2000/svg" class="diagram" id="f05-dpo-svg" viewBox="0 0 920 418" role="img" aria-labelledby="f05-dpo-title f05-dpo-desc"><title id="f05-dpo-title">DPO loss 下降，chosen 概率也可以下降</title><desc id="f05-dpo-desc">DPO loss 下降，chosen 概率也可以下降。完整文字解释见图后分步说明与正文。</desc><defs><marker id="f05-dpo-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--muted,#5b6e64)"/></marker></defs><style>.diagram .node{fill:var(--tint,#eaf2e9);stroke:var(--line,#dbe4dc);stroke-width:1}.diagram .plain{fill:var(--surface,#fff);stroke:var(--line,#dbe4dc)}.diagram .blue{fill:var(--blue-tint,#eaf1f8);stroke:var(--line,#dbe4dc)}.diagram .orange{fill:var(--orange-tint,#fbf0df);stroke:var(--line,#dbe4dc)}.diagram .purple{fill:var(--purple-tint,#f0edf7);stroke:var(--line,#dbe4dc)}.diagram .red{fill:var(--red-tint,#fbeaea);stroke:var(--line,#dbe4dc)}.diagram text{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;fill:var(--ink,#21352c);font-size:15px}.diagram .small{font-size:12px;fill:var(--muted,#5b6e64)}.diagram .mono{font-family:ui-monospace,Menlo,monospace;font-size:14px}.diagram .bold{font-weight:600}.diagram .arrow{fill:none;stroke:var(--muted,#5b6e64);stroke-width:1.5}.diagram .grid{stroke:var(--line,#dbe4dc);stroke-width:1}.diagram .axis{stroke:var(--muted,#5b6e64);stroke-width:1.2}.diagram .series{fill:none;stroke:var(--accent,#28634b);stroke-width:3}.diagram .secondary{fill:none;stroke:var(--blue,#35678b);stroke-width:2;stroke-dasharray:6 5}.diagram .dot{fill:var(--accent,#28634b)}.diagram .warn{fill:var(--orange,#945320)}.diagram .muted-mark{fill:var(--line,#dbe4dc)}</style><text x="40" y="30" class="small" text-anchor="start">参考策略对两种回答的概率相同；其他回答承接剩余概率。</text><text x="40" y="90" class="mono" text-anchor="start">chosen：0.20 → 0.18</text><rect x="360" y="62" width="200" height="25" rx="3" class="plain"/><text x="580" y="80" class="small" text-anchor="start">之前</text><rect x="360" y="103" width="180" height="25" rx="3" class="node"/><text x="760" y="121" class="small" text-anchor="start">之后</text><text x="40" y="202" class="mono" text-anchor="start">rejected：0.20 → 0.10</text><rect x="360" y="174" width="200" height="25" rx="3" class="plain"/><text x="580" y="192" class="small" text-anchor="start">之前</text><rect x="360" y="215" width="100" height="25" rx="3" class="orange"/><text x="760" y="233" class="small" text-anchor="start">之后</text><g class="diagram-node"><rect x="40" y="303" width="245" height="85" rx="8" class="blue"/><text x="162.5" y="330" class="bold" text-anchor="middle">偏好 margin</text><text x="162.5" y="358" class="small" text-anchor="middle">log(chosen/rejected)=0.588</text></g><g class="diagram-node"><rect x="337" y="303" width="245" height="85" rx="8" class="purple"/><text x="459.5" y="330" class="bold" text-anchor="middle">DPO loss</text><text x="459.5" y="358" class="small" text-anchor="middle">0.6642（之前 0.6931）</text></g><g class="diagram-node"><rect x="635" y="303" width="245" height="85" rx="8" class="node"/><text x="757.5" y="330" class="bold" text-anchor="middle">chosen 绝对概率</text><text x="757.5" y="358" class="small" text-anchor="middle">下降，但相对偏好可改善</text></g></svg>