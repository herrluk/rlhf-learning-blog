<svg xmlns="http://www.w3.org/2000/svg" class="diagram" id="f01-kv-svg" viewBox="0 0 920 338" role="img" aria-labelledby="f01-kv-title f01-kv-desc"><title id="f01-kv-title">KV Cache：改 KV 头数，显存差多少</title><desc id="f01-kv-desc">KV Cache：改 KV 头数，显存差多少。完整文字解释见图后分步说明与正文。</desc><defs><marker id="f01-kv-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--muted,#5b6e64)"/></marker></defs><style>.diagram .node{fill:var(--tint,#eaf2e9);stroke:var(--line,#dbe4dc);stroke-width:1}.diagram .plain{fill:var(--surface,#fff);stroke:var(--line,#dbe4dc)}.diagram .blue{fill:var(--blue-tint,#eaf1f8);stroke:var(--line,#dbe4dc)}.diagram .orange{fill:var(--orange-tint,#fbf0df);stroke:var(--line,#dbe4dc)}.diagram .purple{fill:var(--purple-tint,#f0edf7);stroke:var(--line,#dbe4dc)}.diagram .red{fill:var(--red-tint,#fbeaea);stroke:var(--line,#dbe4dc)}.diagram text{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;fill:var(--ink,#21352c);font-size:15px}.diagram .small{font-size:12px;fill:var(--muted,#5b6e64)}.diagram .mono{font-family:ui-monospace,Menlo,monospace;font-size:14px}.diagram .bold{font-weight:600}.diagram .arrow{fill:none;stroke:var(--muted,#5b6e64);stroke-width:1.5}.diagram .grid{stroke:var(--line,#dbe4dc);stroke-width:1}.diagram .axis{stroke:var(--muted,#5b6e64);stroke-width:1.2}.diagram .series{fill:none;stroke:var(--accent,#28634b);stroke-width:3}.diagram .secondary{fill:none;stroke:var(--blue,#35678b);stroke-width:2;stroke-dasharray:6 5}.diagram .dot{fill:var(--accent,#28634b)}.diagram .warn{fill:var(--orange,#945320)}.diagram .muted-mark{fill:var(--line,#dbe4dc)}</style><text x="40" y="30" class="small" text-anchor="start">32 层 · B=8 · L=4096 · head_dim=128 · BF16（2 bytes）</text><text x="40" y="85" class="mono" text-anchor="start">MHA · 32 KV heads</text><rect x="270" y="62" width="490" height="32" rx="4" class="node"/><text x="790" y="85" class="bold" text-anchor="start">16 GiB</text><text x="40" y="158" class="mono" text-anchor="start">GQA · 8 KV heads</text><rect x="270" y="135" width="122.5" height="32" rx="4" class="blue"/><text x="790" y="158" class="bold" text-anchor="start">4 GiB</text><text x="40" y="231" class="mono" text-anchor="start">MQA · 1 KV head</text><rect x="270" y="208" width="15.3125" height="32" rx="4" class="purple"/><text x="790" y="231" class="bold" text-anchor="start">0.5 GiB</text><text x="40" y="304" class="mono" text-anchor="start">容量 = 2 × 层数 × batch × 长度 × KV头数 × head维度 × 字节</text></svg>