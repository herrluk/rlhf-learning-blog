<svg xmlns="http://www.w3.org/2000/svg" class="diagram" id="f04-lora-svg" viewBox="0 0 920 391" role="img" aria-labelledby="f04-lora-title f04-lora-desc"><title id="f04-lora-title">LoRA：为什么一边置零，另一边随机</title><desc id="f04-lora-desc">LoRA：为什么一边置零，另一边随机。完整文字解释见图后分步说明与正文。</desc><defs><marker id="f04-lora-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--muted,#5b6e64)"/></marker></defs><style>.diagram .node{fill:var(--tint,#eaf2e9);stroke:var(--line,#dbe4dc);stroke-width:1}.diagram .plain{fill:var(--surface,#fff);stroke:var(--line,#dbe4dc)}.diagram .blue{fill:var(--blue-tint,#eaf1f8);stroke:var(--line,#dbe4dc)}.diagram .orange{fill:var(--orange-tint,#fbf0df);stroke:var(--line,#dbe4dc)}.diagram .purple{fill:var(--purple-tint,#f0edf7);stroke:var(--line,#dbe4dc)}.diagram .red{fill:var(--red-tint,#fbeaea);stroke:var(--line,#dbe4dc)}.diagram text{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;fill:var(--ink,#21352c);font-size:15px}.diagram .small{font-size:12px;fill:var(--muted,#5b6e64)}.diagram .mono{font-family:ui-monospace,Menlo,monospace;font-size:14px}.diagram .bold{font-weight:600}.diagram .arrow{fill:none;stroke:var(--muted,#5b6e64);stroke-width:1.5}.diagram .grid{stroke:var(--line,#dbe4dc);stroke-width:1}.diagram .axis{stroke:var(--muted,#5b6e64);stroke-width:1.2}.diagram .series{fill:none;stroke:var(--accent,#28634b);stroke-width:3}.diagram .secondary{fill:none;stroke:var(--blue,#35678b);stroke-width:2;stroke-dasharray:6 5}.diagram .dot{fill:var(--accent,#28634b)}.diagram .warn{fill:var(--orange,#945320)}.diagram .muted-mark{fill:var(--line,#dbe4dc)}</style><g class="diagram-node"><rect x="35" y="40" width="160" height="95" rx="8" class="node"/><text x="115" y="67" class="bold" text-anchor="middle">输入 x</text><text x="115" y="95" class="small" text-anchor="middle">d_in 维</text></g><g class="diagram-node"><rect x="269" y="40" width="178" height="95" rx="8" class="plain"/><text x="358" y="67" class="bold" text-anchor="middle">冻结 W</text><text x="358" y="95" class="small" text-anchor="middle">d_out × d_in</text></g><g class="diagram-node"><rect x="269" y="203" width="178" height="95" rx="8" class="blue"/><text x="358" y="230" class="bold" text-anchor="middle">低秩 A</text><text x="358" y="258" class="small" text-anchor="middle">r × d_in；随机</text></g><g class="diagram-node"><rect x="520" y="203" width="178" height="95" rx="8" class="purple"/><text x="609" y="230" class="bold" text-anchor="middle">低秩 B</text><text x="609" y="258" class="small" text-anchor="middle">d_out × r；零</text></g><g class="diagram-node"><rect x="752" y="106" width="136" height="94" rx="8" class="node"/><text x="820" y="133" class="bold" text-anchor="middle">相加</text><text x="820" y="161" class="small" text-anchor="middle">Wx + sBAx</text></g><path d="M195,87 L266,87" class="arrow" marker-end="url(#f04-lora-arrow)"/><path d="M115 135 V250 H266" class="arrow" marker-end="url(#f04-lora-arrow)"/><path d="M447,250 L517,250" class="arrow" marker-end="url(#f04-lora-arrow)"/><path d="M698 250 H820 V203" class="arrow" marker-end="url(#f04-lora-arrow)"/><path d="M447 87 H820 V103" class="arrow" marker-end="url(#f04-lora-arrow)"/><text x="35" y="356" class="small" text-anchor="start">首步：B=0 → dL/dA=0；A≠0 → dL/dB 通常非零。两边都为零则无法启动。</text></svg>