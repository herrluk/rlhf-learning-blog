<svg xmlns="http://www.w3.org/2000/svg" class="diagram" id="f08-publish-svg" viewBox="0 0 920 441" role="img" aria-labelledby="f08-publish-title f08-publish-desc"><title id="f08-publish-title">权重发布：准备完成后，按组一致切换</title><desc id="f08-publish-desc">权重发布：准备完成后，按组一致切换。完整文字解释见图后分步说明与正文。</desc><defs><marker id="f08-publish-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--muted,#5b6e64)"/></marker></defs><style>.diagram .node{fill:var(--tint,#eaf2e9);stroke:var(--line,#dbe4dc);stroke-width:1}.diagram .plain{fill:var(--surface,#fff);stroke:var(--line,#dbe4dc)}.diagram .blue{fill:var(--blue-tint,#eaf1f8);stroke:var(--line,#dbe4dc)}.diagram .orange{fill:var(--orange-tint,#fbf0df);stroke:var(--line,#dbe4dc)}.diagram .purple{fill:var(--purple-tint,#f0edf7);stroke:var(--line,#dbe4dc)}.diagram .red{fill:var(--red-tint,#fbeaea);stroke:var(--line,#dbe4dc)}.diagram text{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;fill:var(--ink,#21352c);font-size:15px}.diagram .small{font-size:12px;fill:var(--muted,#5b6e64)}.diagram .mono{font-family:ui-monospace,Menlo,monospace;font-size:14px}.diagram .bold{font-weight:600}.diagram .arrow{fill:none;stroke:var(--muted,#5b6e64);stroke-width:1.5}.diagram .grid{stroke:var(--line,#dbe4dc);stroke-width:1}.diagram .axis{stroke:var(--muted,#5b6e64);stroke-width:1.2}.diagram .series{fill:none;stroke:var(--accent,#28634b);stroke-width:3}.diagram .secondary{fill:none;stroke:var(--blue,#35678b);stroke-width:2;stroke-dasharray:6 5}.diagram .dot{fill:var(--accent,#28634b)}.diagram .warn{fill:var(--orange,#945320)}.diagram .muted-mark{fill:var(--line,#dbe4dc)}</style><text x="160" y="28" class="small" text-anchor="start">时间 →</text><text x="30" y="89" class="mono" text-anchor="start">Trainer</text><g class="diagram-node"><rect x="180" y="61" width="180" height="64" rx="8" class="plain"/><text x="270" y="88" class="bold" text-anchor="middle">完成 step 43</text><text x="270" y="116" class="small" text-anchor="middle"></text></g><g class="diagram-node"><rect x="389" y="61" width="200" height="64" rx="8" class="blue"/><text x="489" y="88" class="bold" text-anchor="middle">发布 manifest</text><text x="489" y="116" class="small" text-anchor="middle"></text></g><g class="diagram-node"><rect x="637" y="61" width="227" height="64" rx="8" class="node"/><text x="750.5" y="88" class="bold" text-anchor="middle">提交切换 v43</text><text x="750.5" y="116" class="small" text-anchor="middle"></text></g><path d="M362,93 L386,93" class="arrow" marker-end="url(#f08-publish-arrow)"/><path d="M591,93 L634,93" class="arrow" marker-end="url(#f08-publish-arrow)"/><text x="30" y="180" class="mono" text-anchor="start">TP worker 0</text><g class="diagram-node"><rect x="180" y="152" width="180" height="64" rx="8" class="plain"/><text x="270" y="179" class="bold" text-anchor="middle">服务 v42</text><text x="270" y="207" class="small" text-anchor="middle"></text></g><g class="diagram-node"><rect x="389" y="152" width="200" height="64" rx="8" class="blue"/><text x="489" y="179" class="bold" text-anchor="middle">准备 v43 分片</text><text x="489" y="207" class="small" text-anchor="middle"></text></g><g class="diagram-node"><rect x="637" y="152" width="227" height="64" rx="8" class="node"/><text x="750.5" y="179" class="bold" text-anchor="middle">统一服务 v43</text><text x="750.5" y="207" class="small" text-anchor="middle"></text></g><path d="M362,184 L386,184" class="arrow" marker-end="url(#f08-publish-arrow)"/><path d="M591,184 L634,184" class="arrow" marker-end="url(#f08-publish-arrow)"/><text x="30" y="271" class="mono" text-anchor="start">TP worker 1</text><g class="diagram-node"><rect x="180" y="243" width="180" height="64" rx="8" class="plain"/><text x="270" y="270" class="bold" text-anchor="middle">服务 v42</text><text x="270" y="298" class="small" text-anchor="middle"></text></g><g class="diagram-node"><rect x="389" y="243" width="200" height="64" rx="8" class="blue"/><text x="489" y="270" class="bold" text-anchor="middle">准备 v43 分片</text><text x="489" y="298" class="small" text-anchor="middle"></text></g><g class="diagram-node"><rect x="637" y="243" width="227" height="64" rx="8" class="node"/><text x="750.5" y="270" class="bold" text-anchor="middle">统一服务 v43</text><text x="750.5" y="298" class="small" text-anchor="middle"></text></g><path d="M362,275 L386,275" class="arrow" marker-end="url(#f08-publish-arrow)"/><path d="M591,275 L634,275" class="arrow" marker-end="url(#f08-publish-arrow)"/><path d="M615 42 V337" stroke="var(--orange,#945320)" stroke-width="2" stroke-dasharray="5 5"/><text x="615" y="369" class="small" text-anchor="middle">切换边界：完整性检查 + TP 组一致确认</text><text x="40" y="409" class="small" text-anchor="start">在途请求需明确完成旧版、取消或分段续跑；不能让单次 forward 混用新旧权重。</text></svg>