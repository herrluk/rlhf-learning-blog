<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 570" width="480" height="570" role="img" aria-labelledby="matrix-region-title matrix-region-desc" style="display:block;width:100%;max-width:560px;height:auto;margin:0 auto;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
  <title id="matrix-region-title">螺旋遍历：待处理的闭区间矩形</title>
  <desc id="matrix-region-desc">matrix[r][c] 中，列下标 c 向右增加，行下标 r 向下增加。top、bottom 是最上和最下的待处理行，left、right 是最左和最右的待处理列，四条边界均包含在待处理区域中。按编号顺时针读取：一，顶边从左向右；二，右边从上向下；三，若还有行，底边从右向左；四，若还有列，左边从下向上。虚线箭头表示需要重新检查边界。</desc>
  <defs>
    <marker id="mr-axis-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#62766d"/></marker>
    <marker id="mr-top-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#176b52"/></marker>
    <marker id="mr-right-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#315f9c"/></marker>
    <marker id="mr-bottom-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#a3661b"/></marker>
    <marker id="mr-left-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#80559a"/></marker>
  </defs>
  <rect x="1" y="1" width="478" height="568" rx="16" fill="#f0f5ef" stroke="#d5e2d8"/>

  <text x="25" y="37" fill="#314f43" font-size="20" font-family="'SFMono-Regular',Consolas,monospace">matrix[r][c]</text>
  <g fill="#576f63" font-size="20">
    <text x="292" y="77" text-anchor="middle"><tspan font-family="Georgia,serif" font-style="italic">c</tspan><tspan> 向右增加</tspan></text>
    <line x1="154" y1="96" x2="434" y2="96" stroke="#62766d" stroke-width="2" marker-end="url(#mr-axis-arrow)"/>
    <text x="36" y="140" text-anchor="middle" font-size="24" font-family="Georgia,serif" font-style="italic">r</text>
    <line x1="36" y1="156" x2="36" y2="324" stroke="#62766d" stroke-width="2" marker-end="url(#mr-axis-arrow)"/>
    <text x="55" y="226">向下</text><text x="55" y="252">增加</text>
  </g>

  <g fill="#294b3b" font-size="20" font-family="'SFMono-Regular',Consolas,monospace">
    <text x="173" y="132" text-anchor="middle">left</text>
    <text x="412" y="132" text-anchor="middle">right</text>
    <text x="137" y="184" text-anchor="end">top</text>
    <text x="137" y="310" text-anchor="end">bottom</text>
  </g>
  <rect x="150" y="156" width="286" height="168" rx="5" fill="#dceee2" stroke="#5c9676" stroke-width="2"/>
  <g stroke="#b9d6c2" stroke-width="1">
    <path d="M 198 157 V 323 M 246 157 V 323 M 294 157 V 323 M 341 157 V 323 M 389 157 V 323"/>
    <path d="M 151 198 H 435 M 151 240 H 435 M 151 282 H 435"/>
  </g>
  <rect x="196" y="206" width="194" height="68" rx="8" fill="#eaf5eb"/>
  <text x="293" y="235" text-anchor="middle" fill="#244d36" font-size="22" font-weight="600">未处理的区域</text>
  <text x="293" y="261" text-anchor="middle" fill="#576f63" font-size="17">包含四条边界</text>

  <g fill="none" stroke-width="3" stroke-linecap="round">
    <path d="M 174 177 H 405" stroke="#176b52" marker-end="url(#mr-top-arrow)"/>
    <path d="M 412 199 V 284" stroke="#315f9c" marker-end="url(#mr-right-arrow)"/>
    <path d="M 395 303 H 186" stroke="#a3661b" stroke-dasharray="7 6" marker-end="url(#mr-bottom-arrow)"/>
    <path d="M 174 280 V 204" stroke="#80559a" stroke-dasharray="7 6" marker-end="url(#mr-left-arrow)"/>
  </g>
  <g stroke="#f0f5ef" stroke-width="2">
    <circle cx="293" cy="177" r="15" fill="#176b52"/>
    <circle cx="412" cy="240" r="15" fill="#315f9c"/>
    <circle cx="293" cy="303" r="15" fill="#a3661b"/>
    <circle cx="174" cy="240" r="15" fill="#80559a"/>
  </g>
  <g fill="#fff" font-size="18" font-weight="600" text-anchor="middle">
    <text x="293" y="183">1</text><text x="412" y="246">2</text>
    <text x="293" y="309">3</text><text x="174" y="246">4</text>
  </g>

  <text x="25" y="367" fill="#244d36" font-size="22" font-weight="600">一圈的读取顺序</text>
  <g font-size="21" fill="#294b3b">
    <circle cx="39" cy="400" r="14" fill="#176b52"/><text x="39" y="406" text-anchor="middle" fill="#fff" font-size="17">1</text>
    <text x="65" y="407">顶边：从左向右</text>
    <circle cx="39" cy="443" r="14" fill="#315f9c"/><text x="39" y="449" text-anchor="middle" fill="#fff" font-size="17">2</text>
    <text x="65" y="450">右边：从上向下</text>
    <circle cx="39" cy="486" r="14" fill="#a3661b"/><text x="39" y="492" text-anchor="middle" fill="#fff" font-size="17">3</text>
    <text x="65" y="493">底边：从右向左（若还有行）</text>
    <circle cx="39" cy="529" r="14" fill="#80559a"/><text x="39" y="535" text-anchor="middle" fill="#fff" font-size="17">4</text>
    <text x="65" y="536">左边：从下向上（若还有列）</text>
  </g>
</svg>
